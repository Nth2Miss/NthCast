<script>
const els = {
    header: document.getElementById('mainHeader'),
    headerToggle: document.getElementById('headerToggle'),
    toggleIcon: document.getElementById('toggleIcon'),
    v: document.getElementById('v'),
    placeholder: document.getElementById('placeholder'),
    placeholderIcon: document.getElementById('placeholder-icon'),
    loaderIcon: document.getElementById('loader-icon'),
    placeholderText: document.getElementById('placeholder-text'),
    roomInput: document.getElementById('roomInput'),
    btnShare: document.getElementById('btnShare'),
    btnWatch: document.getElementById('btnWatch'),
    statusText: document.getElementById('status-text'),
    statusDot: document.getElementById('status-dot')
};

let CONFIG = null, pc = null, channel = null, pusher = null, localStream = null;
let iceServersCache = null;
let candidateBuffer = [];
let pendingCandidates = []; // 修复点1：用于缓存尚未就绪的 ICE Candidates
let candidateTimeout = null;
let pollInterval = null;
const STORAGE_KEY = 'nth2miss_share_prefs';

els.headerToggle.onclick = () => els.header.classList.toggle('header-collapsed');

function savePrefs() { 
    const prefs = { resolution: getPref('resolution'), fps: getPref('fps'), bitrate: getPref('bitrate'), mode: getPref('mode'), scene: getPref('scene') }; 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs)); 
}

function loadPrefs() { 
    const saved = localStorage.getItem(STORAGE_KEY); 
    if (!saved) return; 
    try { 
        const prefs = JSON.parse(saved); 
        Object.keys(prefs).forEach(group => { 
            const val = prefs[group]; 
            const btnGroup = document.querySelector(`.btn-group[data-group="${group}"]`); 
            if (btnGroup) {
                btnGroup.querySelectorAll('.option-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.value === val));
            }
        }); 
    } catch(e) { console.error(e); } 
}

function getPref(g) { 
    const b = document.querySelector(`.btn-group[data-group="${g}"] .option-btn.active`); 
    return b ? b.dataset.value : null; 
}

const panel = document.getElementById('settingsPanel');
document.getElementById('toggleSettings').onclick = (e) => { 
    e.stopPropagation(); 
    panel.classList.toggle('invisible'); 
    panel.classList.toggle('opacity-0'); 
};
document.onclick = (e) => { 
    if (!panel.contains(e.target)) panel.classList.add('invisible', 'opacity-0'); 
};
document.querySelectorAll('.option-btn').forEach(btn => {
    btn.onclick = function() { 
        const g = this.parentElement; 
        g.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active')); 
        this.classList.add('active'); 
        savePrefs(); 
    };
});

async function initApp(room) {
    if (pusher) return;
    try {
        const [configRes, iceRes] = await Promise.all([fetch('/api/config'), fetch('/api/ice')]);
        const pusherConfig = await configRes.json();
        const iceData = await iceRes.json();
        
        // 兼容 Cloudflare Turn 的返回格式
        iceServersCache = iceData.iceServers ? iceData : { iceServers: iceData };

        if (!pusherConfig.key) {
            log("未配置 Pusher Key", "error");
            return;
        }

        pusher = new Pusher(pusherConfig.key, { cluster: pusherConfig.cluster, authEndpoint: "/api/auth" });
        channel = pusher.subscribe(`private-room-${room}`);

        return new Promise(resolve => {
            channel.bind('pusher:subscription_succeeded', () => {
                bindSignaling();
                resolve();
            });
            pusher.connection.bind('error', () => log("信令连接错误", "error"));
        });
    } catch (e) {
        log("初始化失败", "error");
        console.error(e);
    }
}

// 修复点2：安全地应用缓存的 ICE Candidates
async function applyPendingCandidates() {
    for (let c of pendingCandidates) {
        try {
            await pc.addIceCandidate(c);
        } catch (e) {
            console.warn('添加缓存的候选者失败', e);
        }
    }
    pendingCandidates = [];
}

function bindSignaling() {
    channel.bind('client-offer', async (o) => { 
        if (!localStream) { 
            await createPC(); 
            await pc.setRemoteDescription(new RTCSessionDescription(o)); 
            await applyPendingCandidates(); 
            const a = await pc.createAnswer(); 
            a.sdp = sdpFilter(a.sdp); 
            await pc.setLocalDescription(a); 
            channel.trigger('client-answer', a); 
        } 
    });
    
    channel.bind('client-answer', async (a) => { 
        if (pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(a)); 
            await applyPendingCandidates(); 
        }
    });
    
    channel.bind('client-request-offer', () => { 
        if (localStream) sendSignal(); 
    });
    
    channel.bind('client-stop-share', () => resetView());
    
    channel.bind('client-candidate-batch', (d) => { 
        if (pc && d.candidates) {
            d.candidates.forEach(c => {
                const candidate = new RTCIceCandidate(c);
                if (pc.remoteDescription) {
                    pc.addIceCandidate(candidate).catch(e => console.warn(e)); 
                } else {
                    pendingCandidates.push(candidate); // 暂存直到 RemoteDescription 设置完毕
                }
            });
        }
    });
}

async function createPC() {
    if (pc) pc.close();
    pendingCandidates = [];
    
    // 兼容获取 ICE Server 数组
    let servers = iceServersCache.iceServers;
    if (servers && servers.iceServers) servers = servers.iceServers;

    pc = new RTCPeerConnection({ 
        iceServers: servers,
        iceTransportPolicy: getPref('mode') === 'relay' ? 'relay' : 'all'
    });

    pc.onconnectionstatechange = () => { 
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
            if (localStream) {
                log("等待观众加入...", "loading");
            } else {
                resetView();
            }
        } else if (pc.connectionState === 'connected') {
            log("连接成功", "success");
        }
    };

    pc.onicecandidate = ({candidate}) => { 
        if (!candidate) return; 
        candidateBuffer.push(candidate); 
        clearTimeout(candidateTimeout);
        candidateTimeout = setTimeout(() => { 
            if (candidateBuffer.length > 0) { 
                channel.trigger('client-candidate-batch', { candidates: candidateBuffer }); 
                candidateBuffer = []; 
            } 
        }, 100); 
    };

    pc.ontrack = (e) => { 
        els.placeholderText.innerText = "同步信号..."; 
        setTimeout(() => { 
            log("正在观看", "success"); 
            els.v.classList.remove('hidden'); 
            if(els.v.srcObject !== e.streams[0]) els.v.srcObject = e.streams[0]; 
            els.placeholder.classList.add('hidden'); 
        }, 300); 
        e.track.onended = () => resetView(); 
    };
}

// 修复点3：安全的 SDP 过滤器
const sdpFilter = (sdp) => {
    const bitrate = getPref('bitrate'); 
    if (!bitrate) return sdp;

    try {
        let lines = sdp.split('\r\n');
        let videoIndex = lines.findIndex(l => l.startsWith('m=video'));
        
        if (videoIndex !== -1) {
            lines.splice(videoIndex + 1, 0, `b=AS:${bitrate}`);
        }

        return lines.join('\r\n').replace(
            /a=fmtp:(\d+) (.*packetization-mode=1.*)/g, 
            m => m + `;x-google-min-bitrate=1000;x-google-start-bitrate=${bitrate};x-google-max-bitrate=${bitrate}`
        );
    } catch(e) {
        console.warn("SDP过滤失败，回退默认设置", e);
        return sdp;
    }
};

async function sendSignal() { 
    if(!localStream) return;
    await createPC(); 
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream)); 
    const o = await pc.createOffer(); 
    o.sdp = sdpFilter(o.sdp); 
    await pc.setLocalDescription(o); 
    channel.trigger('client-offer', o); 
}

els.btnShare.onclick = async () => {
    if (localStream) {
        channel.trigger('client-stop-share', { room: els.roomInput.value || "Nth2Miss" }); 
        resetView();
        return;
    }

    const room = els.roomInput.value || "Nth2Miss"; 
    await initApp(room);
    const res = getPref('resolution'), fps = parseInt(getPref('fps'));
    try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ 
            video: { 
                width: { ideal: res === '1080' ? 1920 : 1280 }, 
                height: { ideal: res === '1080' ? 1080 : 720 }, 
                frameRate: { ideal: fps }, 
                cursor: "always",
                displaySurface: "monitor" 
            }, 
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
        });
        
        const vt = localStream.getVideoTracks()[0]; 
        vt.contentHint = getPref('scene') || 'detail';
        
        els.v.srcObject = localStream; 
        els.v.classList.remove('hidden'); 
        els.placeholder.classList.add('hidden');
        log("等待观众", "loading"); 
        
        els.btnShare.innerText = "停止共享";
        els.btnShare.classList.replace('bg-blue-600', 'bg-red-600');
        
        sendSignal();
        vt.onended = () => resetView();
    } catch (e) { log("已取消或拒绝", "error"); }
};

els.btnWatch.onclick = async () => {
    const room = els.roomInput.value || "Nth2Miss";
    els.placeholderIcon.classList.add('hidden'); 
    els.loaderIcon.classList.remove('hidden'); 
    els.placeholderText.innerText = "寻找信号...";
    await initApp(room); 
    
    if(pollInterval) clearInterval(pollInterval);
    
    channel.trigger('client-request-offer', { ready: true });
    
    let attempt = 0;
    pollInterval = setInterval(() => { 
        if (pc && pc.connectionState === 'connected') {
            clearInterval(pollInterval);
            return;
        }
        if (attempt > 4) {
            log("未收到信号，请检查发送端", "error");
            clearInterval(pollInterval);
            return;
        }
        log("同步中...", "loading"); 
        channel.trigger('client-request-offer', { ready: true }); 
        attempt++;
    }, 4000);
};

function resetView() { 
    if (pollInterval) clearInterval(pollInterval);
    els.v.pause(); 
    els.v.srcObject = null; 
    els.v.classList.add('hidden'); 
    els.placeholder.classList.remove('hidden'); 
    els.loaderIcon.classList.add('hidden'); 
    els.placeholderIcon.classList.remove('hidden'); 
    els.placeholderText.innerText = "无信号"; 
    
    els.btnShare.innerText = "开启共享";
    els.btnShare.classList.replace('bg-red-600', 'bg-blue-600');
    
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    
    if (pc) { pc.close(); pc = null; }
    log("就绪", "success"); 
}

function copyRoomLink() { 
    const r = els.roomInput.value || "Nth2Miss"; 
    const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(r); 
    navigator.clipboard.writeText(url).then(() => { 
        const old = els.statusText.innerText; 
        log("已复制", "success"); 
        setTimeout(() => log(old, "success"), 2000); 
    }); 
}

function log(m, t) { 
    if(els.statusText) els.statusText.innerText = m; 
    if(els.statusDot) {
        els.statusDot.className = `w-2 h-2 rounded-full ${
            t === 'success' ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 
            t === 'error' ? 'bg-red-500' : 'bg-blue-500 animate-pulse'
        }`;
    }
}

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) els.roomInput.value = urlParams.get('room');
    loadPrefs(); 
    if (window.lucide) lucide.createIcons();
    els.btnShare.disabled = els.btnWatch.disabled = false;
    els.btnShare.classList.remove('opacity-50'); 
    els.btnWatch.classList.remove('opacity-50');
    log("就绪", "success");
};    
</script>
